name: RTL verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Yosys SAT engine
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Prove ALU equivalence and reject faulty control
        run: make formal
      - name: Preserve formal proof logs and counterexample
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formal-evidence
          path: results/formal/
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install simulators
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: Unit tests, lint, directed, random, coverage and negative tests
        run: make regression SEED=2026 COUNT=1000
      - name: Exhaustive finite-input simulation
        run: make exhaustive
      - name: Generate representative waveform
        run: make waveform
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence
          path: results/
  advanced:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install Verilator build dependencies and Z3
        run: sudo apt-get update && sudo apt-get install -y autoconf bison flex g++ git help2man make perl python3 z3=4.8.12-3.1build1
      - name: Build pinned Verilator release
        run: |
          git clone --depth 1 --branch v5.052 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix=/usr/local
          make -j2
          sudo make install
          verilator --version
          verilator_coverage --version
          z3 --version
      - name: Run feature probes, OOP CRV, native coverage and negative control
        run: make advanced SEED=2026 COUNT=4096
      - name: Preserve advanced logs, waveform and coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: advanced-verification-evidence
          path: results/advanced/
